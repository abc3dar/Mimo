function pickVoice(){
  try{
    var vs=speechSynthesis.getVoices(),pref=['es-AR','es-MX','es-US','es-419','es-ES'];
    if(navigator.onLine===false){var loc=vs.filter(function(x){return x.localService;});if(loc.length)vs=loc;}
    for(var i=0;i<pref.length;i++){var v=vs.find(function(x){return x.lang.replace('_','-')===pref[i];});if(v){voice=v;return;}}
    voice=vs.find(function(x){return x.lang.toLowerCase().indexOf('es')===0;})||null;
  }catch(e){}
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;window.addEventListener('offline',pickVoice);window.addEventListener('online',pickVoice);}

function say(t,cb){
  var my=++sid,fired=false,to;
  function done(){if(fired||my!==sid)return;fired=true;clearTimeout(to);if(cb)cb();}
  if(!('speechSynthesis' in window)){setTimeout(done,700);return;}
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang=voice?voice.lang:'es-ES';if(voice)u.voice=voice;u.rate=0.9;
    u.onend=done;
    u.onerror=function(e){if(e.error==='interrupted'||e.error==='canceled')return;done();};
    to=setTimeout(done,1500+t.length*90);
    setTimeout(function(){if(my===sid)speechSynthesis.speak(u);},60);
  }catch(e){setTimeout(done,700);}
}

function getAC(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}
function beep(freq,dur,pan,delay){
  try{
    var a=getAC(),t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
    o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);
    if(a.createStereoPanner){var p=a.createStereoPanner();p.pan.value=pan||0;g.connect(p);p.connect(a.destination);}
    else g.connect(a.destination);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function tone(z){beep(F[z],0.2,PAN[z]||0,0);}
function jingle(){beep(523,.12,0,0);beep(659,.12,0,.12);beep(784,.22,0,.24);}
function vib(){try{if(navigator.vibrate)navigator.vibrate(80);}catch(e){}}

function loadSounds(){
  if(SNDLOADED)return;SNDLOADED=true;
  try{
    var a=getAC();
    Object.keys(B64).forEach(function(k){
      var bin=atob(B64[k]),u8=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      a.decodeAudioData(u8.buffer,function(b){SND[k]=b;},function(){});
    });
  }catch(e){SNDLOADED=false;}
}
function playSnd(k,vol,fallback){
  try{
    var a=getAC(),b=SND[k];
    if(!b){if(fallback)fallback();return;}
    var s=a.createBufferSource(),g=a.createGain();
    s.buffer=b;g.gain.value=vol||1;s.connect(g);g.connect(a.destination);s.start();
  }catch(e){if(fallback)fallback();}
}

/* ---- Sonido ambiente (sintetizado, sin archivos) ---- */
function nsrc(){
  var a=getAC();
  if(!nb){nb=a.createBuffer(1,a.sampleRate*2,a.sampleRate);var d=nb.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  var s=a.createBufferSource();s.buffer=nb;s.loop=true;s.start();return s;
}
function every(o,fn,min,max){(function loop(){if(amb!==o)return;fn();setTimeout(loop,min+Math.random()*(max-min));})();}
function blip(o,f1,f2,dur,vol,dest){
  try{
    var a=ac,t=a.currentTime,s=a.createOscillator(),g=a.createGain();
    s.type='sine';s.frequency.setValueAtTime(f1,t);s.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*0.15);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(g);g.connect(dest||o.out);s.start(t);s.stop(t+dur+0.05);
  }catch(e){}
}
function stopAmb(){
  if(!amb)return;
  var o=amb;amb=null;ambKind=null;
  try{o.out.gain.linearRampToValueAtTime(0,ac.currentTime+0.6);}catch(e){}
  setTimeout(function(){o.srcs.forEach(function(s){try{s.stop();}catch(e){}});try{o.out.disconnect();}catch(e){}},900);
}
function startAmb(kind){
  stopAmb();
  try{
    var a=getAC(),o={srcs:[]};
    o.out=a.createGain();o.out.gain.setValueAtTime(0,a.currentTime);o.out.gain.linearRampToValueAtTime(1,a.currentTime+1.5);o.out.connect(a.destination);
    amb=o;ambKind=kind;
    var layer=function(type,freq,q,gain,lfoHz,lfoDepth){
      var s=nsrc(),f=a.createBiquadFilter(),g=a.createGain();
      f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.value=gain;
      s.connect(f);f.connect(g);g.connect(o.out);o.srcs.push(s);
      if(lfoHz){var l=a.createOscillator(),d=a.createGain();l.frequency.value=lfoHz;d.gain.value=lfoDepth;l.connect(d);d.connect(g.gain);l.start();o.srcs.push(l);}
    };
    if(kind==='bosque'){
      layer('lowpass',450,.5,.05,.12,.03);
      every(o,function(){var f=2200+Math.random()*1800;blip(o,f,f*1.4,.12,.035);
        setTimeout(function(){if(amb===o)blip(o,f*1.1,f*1.5,.1,.03);},170);},1800,4500);
    }else if(kind==='prado'){
      layer('lowpass',500,.5,.03,.1,.015);
      every(o,function(){for(var k=0;k<3;k++)setTimeout(function(){if(amb===o)blip(o,4200,4350,.045,.018);},k*75);},700,1600);
    }else if(kind==='rio'){
      layer('bandpass',1100,.6,.06,.5,.02);layer('lowpass',250,.5,.05);
      every(o,function(){var f=450+Math.random()*500;blip(o,f,f*1.8,.09,.025);},300,1100);
    }else if(kind==='montana'){
      layer('bandpass',380,1.2,.07,.09,.05);layer('lowpass',200,.5,.03);
      every(o,function(){blip(o,720,600,1.8,.012);},7000,13000);
    }else{
      var dl=a.createDelay(),fb=a.createGain();dl.delayTime.value=.3;fb.gain.value=.4;
      dl.connect(fb);fb.connect(dl);dl.connect(o.out);
      o.drip=a.createGain();o.drip.connect(o.out);o.drip.connect(dl);
      layer('lowpass',180,.5,.03,.07,.015);
      [55,82.4].forEach(function(fr){var s=a.createOscillator(),g=a.createGain();s.frequency.value=fr;g.gain.value=.025;s.connect(g);g.connect(o.out);s.start();o.srcs.push(s);});
      every(o,function(){var f=1300+Math.random()*700;blip(o,f,f*.6,.18,.06,o.drip);},1500,3800);
    }
  }catch(e){}
}

/* ---- Tablero y juego ---- */
function build(){
  errs=0;choice=false;pend=null;
  var c=cfg(),e=c.e,w=document.getElementById('wrap');
  w.style.gridTemplateAreas=e.areas;w.style.gridTemplateColumns=e.cols;w.style.gridTemplateRows=e.rows;
  w.innerHTML='';w.className=(e.zones.length===6)?'six':'';
  e.zones.forEach(function(z){
    var d=document.createElement('div');
    d.className='zone';d.dataset.z=z;d.style.gridArea=z;d.style.background=COL[z];d.setAttribute('role','button');d.setAttribute('aria-label',nm(z));d.tabIndex=0;
    d.textContent=z.replace('-izq',' izquierda').replace('-der',' derecha').toUpperCase();
    w.appendChild(d);
  });
  if(ambKind!==e.kind)startAmb(e.kind);
  label();
}
function label(){var c=cfg();document.getElementById('lvl').textContent=c.e.name+' · Nivel '+(c.m+1)+' de 3 · '+step+'/'+c.n;}

/*BAG*/
var bag=[],bagLv=-1,pbag=[],pbagLv=-1,lastPair='';
function shuffle(a){for(var i=a.length-1;i>0;i--){var k=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[k];a[k]=t;}return a;}
function drawZ(){
  var zs=cfg().e.zones;
  if(bagLv!==lv){bag=[];bagLv=lv;}
  if(!bag.length){
    bag=shuffle(zs.slice());
    if(zs.length>2&&bag[bag.length-1]===last){var t=bag.pop();bag.unshift(t);}
  }
  last=bag.pop();return last;
}
function drawPair(){
  var zs=cfg().e.zones;
  if(pbagLv!==lv){pbag=[];pbagLv=lv;}
  if(!pbag.length){
    zs.forEach(function(a){zs.forEach(function(b){pbag.push([a,b]);});});
    shuffle(pbag);
    if(pbag[pbag.length-1].join()===lastPair){var t=pbag.pop();pbag.unshift(t);}
  }
  var p=pbag.pop();lastPair=p.join();return p;
}
/*ENDBAG*/
function choiceText(){return 'Para '+(lv===0?'intentar de nuevo':'volver al nivel anterior')+', tocá dos veces arriba. Para dormir un rato, tocá dos veces abajo.';}
function buildChoice(){
  var w=document.getElementById('wrap');
  w.style.gridTemplateAreas='"arriba" "abajo"';w.style.gridTemplateColumns='1fr';w.style.gridTemplateRows='1fr 1fr';
  w.innerHTML='';w.className='';
  [['arriba',lv===0?'INTENTAR DE NUEVO':'NIVEL ANTERIOR'],['abajo','DORMIR UN RATO']].forEach(function(p){
    var d=document.createElement('div');
    d.className='zone';d.dataset.z=p[0];d.style.gridArea=p[0];d.style.background=COL[p[0]];d.textContent=p[1];d.setAttribute('role','button');d.setAttribute('aria-label',p[1]);d.tabIndex=0;
    w.appendChild(d);
  });
  document.getElementById('lvl').textContent='Mimo se perdió';
}
function lostFlow(){
  busy=true;clearTimeout(rt);choice=true;pend=null;
  buildChoice();
  say('Mimo se perdió. ¿Querés '+(lv===0?'intentarlo de nuevo':'volver al nivel anterior')+' o dormir un rato para descansar y volver a intentar luego? '+choiceText(),
    function(){busy=false;schedule();});
}
function chooseOpt(z){
  tone(z);busy=true;clearTimeout(rt);
  if(z==='arriba'){
    var back=lv>0;if(back)lv--;
    step=0;save();build();
    say((back?'Volvemos al nivel anterior. ':'Intentemos de nuevo. ')+levelIntro(),ask);
  }else{
    stopAmb();
    say('¡A descansar! Nos vemos la próxima.',function(){
      ended=true;started=false;
      document.getElementById('startMsg').innerHTML='¡A descansar!<br>Nos vemos la próxima';
      document.getElementById('start').style.display='flex';
    });
  }
}
function prompt(){if(choice)return choiceText();return cfg().seq?(seq[0]===seq[1]?'Elegí '+nm(seq[0])+', y después otra vez '+nm(seq[0]):'Elegí '+nm(seq[0])+' y después '+nm(seq[1])):'Elegí '+nm(current);}
function hint(){
  if(choice||!started||busy)return;
  var c=cfg();
  if(c.m!==0&&errs<2)return;
  if(c.seq){var s1=seq[1];tone(seq[0]);setTimeout(function(){if(started&&!busy&&!choice)tone(s1);},650);}
  else tone(current);
}

function levelIntro(){
  var c=cfg();
  if(c.m===0)return c.e.intro+' Después de mi voz vas a escuchar un sonido que te ayuda a encontrar el lugar. Recordá: un toque te dice dónde estás, y dos toques eligen.';
  if(c.m===1)return 'Seguimos en '+c.e.where+'. Ahora lo hacemos sin ayuda, solo con mi voz.';
  return 'Seguimos en '+c.e.where+'. Ahora son dos pasos seguidos. Escuchá bien.';
}

function schedule(){
  clearTimeout(rt);
  rt=setTimeout(function(){if(started&&!busy)say(prompt(),hint);schedule();},12000);
}
function ask(){
  busy=false;pend=null;
  if(cfg().seq){seq=drawPair();si=0;current=seq[0];}
  else current=drawZ();
  say(prompt(),hint);
  schedule();
}

function zname(z){
  if(choice)return z==='arriba'?(lv===0?'intentar de nuevo':'nivel anterior'):'dormir un rato';
  return nm(z);
}
function explore(z){
  tone(z);
  var extra=(remind>0)?'. Tocá otra vez para elegir.':'';
  if(remind>0)remind--;
  say(zname(z)+extra);
}
function tap(z,el){
  if(!started||busy)return;
  var now=Date.now();
  if(pend===z&&now-pendT<=DBL){pend=null;activate(z,el);return;}
  pend=z;pendT=now;explore(z);
}
function activate(z,el){
  if(!started||busy)return;
  if(choice){chooseOpt(z);return;}
  var c=cfg();
  tone(z);
  var ok=c.seq?(z===seq[si]):(z===current);
  if(!ok){
    errs++;
    playSnd('angry',.9,function(){beep(180,.3,0,0);});
    busy=true;clearTimeout(rt);
    if(errs>=5){setTimeout(lostFlow,800);return;}
    setTimeout(function(){
      say('Eso es '+nm(z)+'. '+(c.seq?'Probemos de nuevo. ':'')+prompt()+((c.m!==0&&errs===2)?'. Te ayudo con un sonido.':''),function(){busy=false;si=0;hint();schedule();});
    },800);
    return;
  }
  if(c.seq&&si===0){si=1;playSnd('happy',.7,function(){beep(784,.1,0,0);});return;}
  busy=true;clearTimeout(rt);
  step++;label();vib();
  el.classList.add('ok');setTimeout(function(){el.classList.remove('ok');},500);
  var praise=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  if(step>=c.n){playSnd('purr',.6);finishLevel(praise);}
  else{
    playSnd('happy',.9,jingle);
    setTimeout(function(){say(praise,function(){setTimeout(ask,300);});},700);
  }
}

function finishLevel(praise){
  var c=cfg();
  if(lv===TOTAL-1){
    stopAmb();
    setTimeout(function(){say(praise+' '+c.e.outro+' '+FINALE,function(){
      lv=0;step=0;save();started=false;
      document.getElementById('startMsg').innerHTML='Tocá la pantalla<br>para jugar otra vez';
      introDone=false;triggered=true;narrating=false;startPromptText='Tocá la pantalla para jugar otra vez';scheduleStartReminder();
      document.getElementById('start').style.display='flex';
    });},1000);
    return;
  }
  var text=praise+' '+(c.m<2?'¡Subimos de nivel!':c.e.outro);
  setTimeout(function(){say(text,function(){
    lv++;step=0;save();build();
    say(levelIntro(),ask);
  });},1000);
}

function begin(){
  if(started||ended)return;
  started=true;
  loadSounds();
  document.getElementById('start').style.display='none';
  beep(523,.15,0,0);
  step=0;last=null;
  build();
  remind=2;wake();
  clearTimeout(startTimer);
  var first=introDone?'':((lv===0)?STORY:'Seguimos con la aventura de Mimo.')+' '+HOWTO+' ';
  say(first+levelIntro(),ask);
}

function welcomeText(){
  if(lv===0)return STORY+' '+HOWTO+' Para empezar, tocá la pantalla en cualquier lugar.';
  return '¡Hola de nuevo! Soy Mimo. Seguimos con la aventura. '+HOWTO+' Para continuar, tocá la pantalla en cualquier lugar.';
}
function scheduleStartReminder(){
  clearTimeout(startTimer);
  startTimer=setTimeout(function(){
    if(started||ended)return;
    say(startPromptText);
    scheduleStartReminder();
  },15000);
}
function speakWelcome(fromGesture){
  if(started||ended||!('speechSynthesis' in window))return;
  var my=++sid,spoke=false,fin=false,text=welcomeText();
  triggered=true;narrating=true;welcomeSpoke=false;
  if(fromGesture){gestureTries++;beep(660,.12,0,0);}
  function finish(natural){
    if(fin||my!==sid)return;
    fin=true;narrating=false;
    if(natural){triggered=true;introDone=true;scheduleStartReminder();}
    else triggered=(gestureTries>=2);   // tras dos intentos con toque y sin voz, se asume que no hay voz
  }
  try{
    var u=new SpeechSynthesisUtterance(text);
    u.lang=voice?voice.lang:'es-ES';if(voice)u.voice=voice;u.rate=0.9;
    u.onstart=function(){spoke=true;welcomeSpoke=true;};
    u.onend=function(){finish(true);};
    u.onerror=function(e){if(e.error==='interrupted'||e.error==='canceled')return;finish(false);};
    if(speechSynthesis.speaking||speechSynthesis.pending){
      speechSynthesis.cancel();
      setTimeout(function(){if(my===sid)speechSynthesis.speak(u);},60);
    }else speechSynthesis.speak(u);       // dentro del toque, para que el navegador lo permita
    setTimeout(function(){if(!spoke)finish(false);},2200);
    setTimeout(function(){if(spoke)finish(true);},1500+text.length*90);
  }catch(e){narrating=false;triggered=(gestureTries>=2);}
}
function coverTap(){
  if(started||ended)return;
  var now=Date.now();
  if(now-lastCover<400)return;
  lastCover=now;
  loadSounds();
  if(narrating){if(!welcomeSpoke&&gestureTries===0)speakWelcome(true);return;}   // dejar que termine la presentación
  if(!triggered){speakWelcome(true);return;} // primer toque: habilita el audio y habla en la portada
  begin();
}
load();
var startEl=document.getElementById('start');
startEl.addEventListener('pointerup',coverTap,{passive:true});
startEl.addEventListener('keydown',coverTap,{passive:true});
startEl.addEventListener('click',function(e){if(e.detail===0)coverTap();},{passive:true});
var PAW='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48"><g fill="#ffb703" stroke="#1b1b2f" stroke-width="3"><ellipse cx="32" cy="45" rx="16" ry="13"/><ellipse cx="13" cy="28" rx="6.5" ry="8.5" transform="rotate(-20 13 28)"/><ellipse cx="25" cy="15" rx="6.5" ry="8.5" transform="rotate(-8 25 15)"/><ellipse cx="39" cy="15" rx="6.5" ry="8.5" transform="rotate(8 39 15)"/><ellipse cx="51" cy="28" rx="6.5" ry="8.5" transform="rotate(20 51 28)"/></g></svg>');
document.documentElement.style.cursor='url("'+PAW+'") 24 24, pointer';   // mouse
var pawEl=document.getElementById('paw');pawEl.style.backgroundImage='url("'+PAW+'")';   // dedo en pantallas táctiles
function pawAt(e){if(e.pointerType==='mouse')return;pawEl.style.transition='none';pawEl.style.opacity='0.95';pawEl.style.left=e.clientX+'px';pawEl.style.top=e.clientY+'px';}
function pawOff(){pawEl.style.transition='opacity .6s';pawEl.style.opacity='0';}
document.addEventListener('pointerdown',pawAt);
document.addEventListener('pointermove',pawAt);
['pointerup','pointercancel'].forEach(function(ev){document.addEventListener(ev,pawOff);});
function zoneOf(t){var el=t&&t.closest?t.closest('.zone'):null;return el;}
var wrapEl=document.getElementById('wrap');
wrapEl.addEventListener('pointerdown',function(e){
  var el=zoneOf(e.target);
  if(el){e.preventDefault();down=true;downZone=el.dataset.z;tap(el.dataset.z,el);}
});
wrapEl.addEventListener('pointermove',function(e){
  if(!down)return;
  var el=zoneOf(document.elementFromPoint(e.clientX,e.clientY));
  if(el&&el.dataset.z!==downZone){downZone=el.dataset.z;if(started&&!busy)explore(downZone);}
});
['pointerup','pointercancel'].forEach(function(ev){wrapEl.addEventListener(ev,function(){down=false;downZone=null;});});
wrapEl.addEventListener('click',function(e){
  if(e.detail!==0)return;
  var el=zoneOf(e.target);
  if(el)activate(el.dataset.z,el);
});
function wake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}}
document.addEventListener('visibilitychange',function(){
  try{
    if(document.hidden){if(ac&&ac.state==='running')ac.suspend();}
    else{if(started)wake();if(ac&&ac.state==='suspended')ac.resume();}
  }catch(e){}
});
window.addEventListener('load',function(){speakWelcome(false);});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
</body>
